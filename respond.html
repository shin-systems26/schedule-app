<!DOCTYPE html>
<html lang="ja">
<head>
  <base target="_top">
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>日程調整</title>
  <style>
    * { box-sizing: border-box; }
    html { -webkit-text-size-adjust: 100%; }
    body { margin: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Noto Sans JP", sans-serif; background: #f6f7fb; color: #222; -webkit-user-select: none; user-select: none; }
    .wrap { max-width: 1100px; margin: 0 auto; padding: 20px 12px 80px; }
    h1 { margin: 0 0 10px; font-size: 28px; }
    .intro, .card { background: white; padding: 18px; border-radius: 18px; box-shadow: 0 6px 22px rgba(0,0,0,.06); }
    .intro { line-height: 1.8; margin-bottom: 18px; }
    .card { margin: 16px 0; }
    .card h2 { margin: 0 0 8px; font-size: 20px; line-height: 1.5; }
    .hint { color: #666; line-height: 1.7; font-size: 14px; margin-bottom: 14px; }
    input { width: 100%; max-width: 420px; padding: 12px 14px; font-size: 16px; border: 1px solid #ccc; border-radius: 10px; -webkit-user-select: text; user-select: text; }
    .legend { display: flex; gap: 8px; flex-wrap: wrap; margin: 12px 0; }
    .legend span { padding: 9px 12px; border-radius: 10px; font-weight: bold; }
    .yes-label { background: #dcfce7; color: #166534; }
    .no-label { background: #fee2e2; color: #991b1b; }
    .maybe-label { background: #f3f4f6; color: #4b5563; }
    .simple-title { font-weight: bold; font-size: 16px; margin: 16px 0 8px; }
    .simple-wrap, .grid-wrap { overflow-x: auto; -webkit-overflow-scrolling: touch; }
    .simple-table { width: 100%; min-width: 520px; border-collapse: separate; border-spacing: 5px; }
    .simple-table th { padding: 8px; font-size: 14px; }
    .simple-table td { text-align: center; }
    .simple-button { width: 100%; min-height: 50px; border: none; border-radius: 10px; cursor: pointer; font-weight: bold; font-size: 18px; background: #f3f4f6; -webkit-tap-highlight-color: transparent; }
    .simple-button.yes { background: #22c55e; color: white; }
    .simple-button.no { background: #ef4444; color: white; }
    .simple-button.maybe { background: #f3f4f6; color: #777; }
    .toolbar { display: flex; gap: 8px; flex-wrap: wrap; margin: 14px 0; }
    .toolbar button { border: none; border-radius: 10px; padding: 10px 13px; font-weight: bold; cursor: pointer; background: #eceef3; -webkit-tap-highlight-color: transparent; }
    .copy-button { background: #e0e7ff !important; color: #3730a3; }
    .detail-button { background: #111827 !important; color: white; }
    .detail { display: none; margin-top: 16px; }
    .detail.open { display: block; }
    .grid-wrap { border: 1px solid #ddd; border-radius: 12px; background: white; position: relative; }
    .grid { display: grid; grid-template-columns: 92px repeat(13, 62px); min-width: 898px; user-select: none; -webkit-user-select: none; }
    .cell { height: 52px; min-width: 0; border-right: 1px solid #eee; border-bottom: 1px solid #eee; display: flex; justify-content: center; align-items: center; font-size: 13px; overflow: hidden; }
    .header { background: #fafafa; font-weight: bold; position: relative; z-index: 1; }
    .date { background: #fafafa; font-weight: bold; position: sticky; left: 0; z-index: 5; color: #222; }
    .slot { cursor: pointer; touch-action: auto; -webkit-tap-highlight-color: transparent; -webkit-touch-callout: none; user-select: none; position: relative; }
    .slot.yes { background: #22c55e; color: white; }
    .slot.no { background: #ef4444; color: white; }
    .slot.maybe { background: white; color: #aaa; }
    .mark { display: block; font-size: 18px; font-weight: bold; line-height: 1; pointer-events: none; }
    .submit-wrap { position: sticky; bottom: 0; z-index: 20; padding-top: 14px; background: linear-gradient(to top, #f6f7fb 75%, transparent); }
    .submit { width: 100%; padding: 16px; border: none; border-radius: 12px; background: #111827; color: white; font-size: 17px; font-weight: bold; cursor: pointer; }
    .submit:disabled { opacity: .6; }
    .status { text-align: center; font-weight: bold; min-height: 25px; margin-top: 8px; }
    .feedback-link {
      text-align: center;
      margin-top: 30px;
    }
    .feedback-link a {
      display: inline-block;
      padding: 12px 18px;
      background: #eceef3;
      color: #111827;
      text-decoration: none;
      border-radius: 10px;
      font-weight: bold;
    }
    .feedback-link a:hover {
      background: #dfe2e8;
    }
    @media (max-width: 600px) { .wrap { padding: 14px 8px 70px; } h1 { font-size: 23px; } .card, .intro { padding: 14px; } .card h2 { font-size: 18px; } }
  </style>
</head>
<body>
  <div class="wrap">
    <h1 id="pageTitle">
日程調整
</h1>
    <p id="eventInfo">
  イベント情報を読み込み中…
</p>
    <div class="intro">
      まだ<span id="eventMonthRangeText"></span>の予定が確定していなくても大丈夫です。<br><br>
      まずは、<b>「普段この曜日・時間帯なら参加できそう？」</b>という感覚でざっくり回答してください。<br><br>
      <b>○ 参加できそう</b><br><b>× 絶対に無理</b><br><b>？ まだ分からない</b><br><br>
      まだ分からないところは、<b>「？」のままでOK</b>です。<br>
      曜日ごとの回答を<span id="dateRangeText"></span>の実際の日付に自動で反映します。<br><br>
      「<span id="exampleDateText"></span>だけ予定がある」など、特定の日だけ違う場合は、<b>「特定の日だけ細かく修正する」</b>から変更できます。
    </div>

    <div class="card"><h2>名前</h2><input id="name" type="text" placeholder="例：山田 太郎"></div>
    <div class="legend"><span class="yes-label">○ 参加できそう</span><span class="no-label">× 絶対に無理</span><span class="maybe-label">？ まだ分からない</span></div>
    <div id="cards"></div>
    <div class="submit-wrap"><button id="submitButton" class="submit" disabled onclick="submitForm()">回答を送信</button><div id="status" class="status"></div></div>
    <div class="feedback-link">
      <a
        href="https://github.com/shin-systems26/schedule-app/discussions/1"
        target="_blank"
        rel="noopener noreferrer"
      >
        💬 ご意見・改善要望はこちら
      </a>
    </div>
  </div>

  <script>
    // const YEAR = 2026;
// const MONTH = 10;
// const START_DAY = 1;
// const END_DAY = 15;
let eventDates = [];
let currentEventOpen = false;
let currentEventId = null;
let submitting = false;
    const START_HOUR = 9;
    const END_HOUR = 22;
    const periods = [
      { id: 'morning', name: '午前', text: '9〜12時', start: 9, end: 12 },
      { id: 'afternoon', name: '午後', text: '12〜17時', start: 12, end: 17 },
      { id: 'night', name: '夜', text: '17〜22時', start: 17, end: 22 }
    ];
    const weekdays = [{ id: 1, name: '月' }, { id: 2, name: '火' }, { id: 3, name: '水' }, { id: 4, name: '木' }, { id: 5, name: '金' }, { id: 6, name: '土' }, { id: 0, name: '日' }];
    let groups = [];
    const state = Object.create(null);
    const simpleState = Object.create(null);
    let drag = { active: false, group: null, value: null, last: null };
    const pad = number => String(number).padStart(2, '0');
    const keyFor = (day, hour) => `${YEAR}-${pad(MONTH)}-${pad(day)} ${pad(hour)}:00〜${pad(hour + 1)}:00`;
    function nextState(value) { if (value === 'maybe') return 'yes'; if (value === 'yes') return 'no'; return 'maybe'; }
    function markFor(value) { if (value === 'yes') return '○'; if (value === 'no') return '×'; return '？'; }

    function escapeHtml(text) {
      const element = document.createElement('span');
      element.textContent = text;
      return element.innerHTML;
    }

    function createCards() {
      const root = document.getElementById('cards');
      root.innerHTML = '';
      groups.forEach((group, index) => {
        state[group.id] = {};
        simpleState[group.id] = {};
        weekdays.forEach(weekday => periods.forEach(period => { simpleState[group.id][`${weekday.id}_${period.id}`] = 'maybe'; }));
        const card = document.createElement('div');
        card.className = 'card';
        card.innerHTML = `<h2>${escapeHtml(group.title)}</h2><div class="hint">まずは曜日ごとにざっくり回答してください。<br>「？」を押すと「○」、もう一度押すと「×」、もう一度押すと「？」に戻ります。</div>${index > 0 ? '<div class="toolbar"><button type="button" class="copy-button" onclick="copyFromEnv(\'' + group.id + '\')">①と同じ回答をコピー</button></div>' : ''}<div class="simple-title">曜日ごとの参加しやすさ</div><div class="simple-wrap"><table class="simple-table"><thead><tr><th>曜日</th><th>午前<br>9〜12</th><th>午後<br>12〜17</th><th>夜<br>17〜22</th></tr></thead><tbody id="${group.id}Simple"></tbody></table></div><div class="toolbar"><button type="button" class="detail-button" onclick="toggleDetail('${group.id}', this)">特定の日だけ細かく修正する</button></div><div id="${group.id}Detail" class="detail"><div class="hint">上で設定した曜日ごとの回答が<span class="dynamic-date-range"></span>に反映されています。<br>特定の日だけ違う場合、そのマスをタップして変更してください。<br>スマホでは表を左右にスクロールできます。</div><div id="${group.id}Grid" class="grid-wrap"></div></div>`;
        root.appendChild(card);
        createSimpleTable(group.id);
        createGrid(group.id, `${group.id}Grid`);
      });
    }

    function createSimpleTable(group) {
      const tbody = document.getElementById(`${group}Simple`);
      weekdays.forEach(weekday => {
        const row = document.createElement('tr');
        const heading = document.createElement('th');
        heading.textContent = weekday.name;
        row.appendChild(heading);
        periods.forEach(period => {
          const cell = document.createElement('td');
          const button = document.createElement('button');
          button.type = 'button';
          button.className = 'simple-button maybe';
          button.textContent = '？';
          button.dataset.group = group;
          button.dataset.weekday = weekday.id;
          button.dataset.period = period.id;
          button.addEventListener('click', () => {
            const key = `${weekday.id}_${period.id}`;
            const next = nextState(simpleState[group][key]);
            simpleState[group][key] = next;
            updateSimpleButton(button, next);
            applySimpleToCalendar(group, weekday.id, period, next);
          });
          cell.appendChild(button);
          row.appendChild(cell);
        });
        tbody.appendChild(row);
      });
    }

    function updateSimpleButton(button, value) {
      button.classList.remove('yes', 'no', 'maybe');
      button.classList.add(value);
      button.textContent = markFor(value);
    }

    function applySimpleToCalendar(
  group,
  weekday,
  period,
  value
) {

  eventDates.forEach(dateInfo => {

    const date = new Date(
      Date.UTC(
        dateInfo.year,
        dateInfo.month - 1,
        dateInfo.day
      )
    );

    if (
      date.getUTCDay() !== Number(weekday)
    ) {
      return;
    }

    for (
      let hour = period.start;
      hour < period.end;
      hour++
    ) {

      const key =
        `${dateInfo.key} ` +
        `${String(hour).padStart(2, "0")}:00〜` +
        `${String(hour + 1).padStart(2, "0")}:00`;

      const cell =
        document.querySelector(
          `.slot[data-group="${group}"]` +
          `[data-key="${key}"]`
        );

      if (cell) {
        applyState(
          cell,
          value
        );
      }
    }
  });
}

    function createGrid(group, mountId) {
      const mount = document.getElementById(mountId);
      const grid = document.createElement('div');
      grid.className = 'grid';
      const corner = document.createElement('div');
      corner.className = 'cell header date';
      corner.textContent = '日付';
      grid.appendChild(corner);
      for (let hour = START_HOUR; hour < END_HOUR; hour++) {
        const header = document.createElement('div');
        header.className = 'cell header';
        header.textContent = `${hour}〜${hour + 1}`;
        grid.appendChild(header);
      }
      eventDates.forEach(dateInfo => {
        const dateCell = document.createElement('div');
        dateCell.className = 'cell date';
        dateCell.textContent =
  `${dateInfo.month}/${dateInfo.day}`;
        grid.appendChild(dateCell);
        for (let hour = START_HOUR; hour < END_HOUR; hour++) {
          const key =
            `${dateInfo.key} ` +
            `${String(hour).padStart(2, "0")}:00〜` +
            `${String(hour + 1).padStart(2, "0")}:00`;
          state[group][key] = 'maybe';
          const cell = document.createElement('div');
          cell.className = 'cell slot maybe';
          cell.dataset.group = group;
          cell.dataset.key = key;
          cell.innerHTML = '<span class="mark">？</span>';
          cell.addEventListener('mousedown', event => {
            if (event.pointerType === 'touch') return;
            event.preventDefault();
            const value = nextState(state[group][key]);
            drag = { active: true, group, value, last: key };
            applyState(cell, value);
          });
          cell.addEventListener('mouseenter', () => {
            if (!drag.active || drag.group !== group || drag.last === key) return;
            drag.last = key;
            applyState(cell, drag.value);
          });
          cell.addEventListener('click', () => {
            if (window.matchMedia('(pointer: coarse)').matches) applyState(cell, nextState(state[group][key]));
          });
          grid.appendChild(cell);
        }
      });
      mount.appendChild(grid);
    }

    function applyState(cell, value) {
      const group = cell.dataset.group;
      const key = cell.dataset.key;
      state[group][key] = value;
      cell.classList.remove('yes', 'no', 'maybe');
      cell.classList.add(value);
      const mark = cell.querySelector('.mark');
      if (mark) mark.textContent = markFor(value);
    }

    function toggleDetail(group, button) {
      const detail = document.getElementById(`${group}Detail`);
      detail.classList.toggle('open');
      button.textContent = detail.classList.contains('open') ? '細かい修正を閉じる' : '特定の日だけ細かく修正する';
    }

    function copyFromEnv(target) {
      const sourceGroup = groups[0];
      Object.keys(simpleState[sourceGroup.id]).forEach(key => { simpleState[target][key] = simpleState[sourceGroup.id][key]; });
      document.querySelectorAll(`#${target}Simple .simple-button`).forEach(button => updateSimpleButton(button, simpleState[target][`${button.dataset.weekday}_${button.dataset.period}`]));
      Object.keys(state[sourceGroup.id]).forEach(key => {
        const cell = document.querySelector(`.slot[data-group="${target}"][data-key="${key}"]`);
        if (cell) applyState(cell, state[sourceGroup.id][key]);
      });
      showMessage('①の回答をコピーしました。');
    }

    document.addEventListener('mouseup', () => { drag.active = false; drag.group = null; });
    window.addEventListener('blur', () => { drag.active = false; drag.group = null; });
    function showMessage(message) {
      const status = document.getElementById('status');
      status.textContent = message;
      setTimeout(() => { if (status.textContent === message) status.textContent = ''; }, 2200);
    }
    function makeDateList(startDate, endDate) {

  const startParts = startDate.split("-").map(Number);
  const endParts = endDate.split("-").map(Number);

  const current = new Date(Date.UTC(
    startParts[0],
    startParts[1] - 1,
    startParts[2]
  ));

  const end = new Date(Date.UTC(
    endParts[0],
    endParts[1] - 1,
    endParts[2]
  ));

  const dates = [];

  while (current <= end) {

    const year = current.getUTCFullYear();
    const month = current.getUTCMonth() + 1;
    const day = current.getUTCDate();

    dates.push({
      year,
      month,
      day,
      key:
        `${year}-${String(month).padStart(2, "0")}-` +
        `${String(day).padStart(2, "0")}`
    });

    current.setUTCDate(
      current.getUTCDate() + 1
    );
  }

  return dates;
}

function formatJapaneseDate(dateString) {
  const [, month, day] = dateString.split("-").map(Number);
  return `${month}月${day}日`;
}

function formatJapaneseMonthRange(startDate, endDate) {
  const [, startMonth] = startDate.split("-").map(Number);
  const [, endMonth] = endDate.split("-").map(Number);

  return startMonth === endMonth
    ? `${startMonth}月`
    : `${startMonth}月〜${endMonth}月`;
}

function updateDynamicDateText(startDate, endDate) {
  const dateRange =
    `${formatJapaneseDate(startDate)}〜${formatJapaneseDate(endDate)}`;

  document.getElementById("eventMonthRangeText").textContent =
    formatJapaneseMonthRange(startDate, endDate);

  document.getElementById("exampleDateText").textContent =
    formatJapaneseDate(startDate);

  document.getElementById("dateRangeText").textContent =
    dateRange;

  document.querySelectorAll(".dynamic-date-range").forEach(
    element => {
      element.textContent = dateRange;
    }
  );
}

    async function submitForm() {
  if (submitting) return;

  const name =
    document
      .getElementById("name")
      .value
      .trim();

  const status =
    document.getElementById("status");

  if (!currentEventOpen) {
    status.textContent =
      "このイベントの回答受付は終了しています。";

    return;
  }

  const button =
    document.getElementById("submitButton");

  if (!name) {
    status.textContent =
      "名前を入力してください。";
    return;
  }

  if (!currentEventId) {
    status.textContent =
      "イベント情報を読み込めていません。";
    return;
  }

  submitting = true;
  button.disabled = true;
  button.textContent = "送信中…";
  status.textContent = "";

  try {

    const responseId =
      await window.saveResponseToFirestore(
        currentEventId,
        {
          name: name,
          answers: state
        }
      );

    console.log(
      "回答保存成功:",
      responseId
    );

    status.textContent =
      "送信しました！ありがとうございます。";

    button.textContent =
      "送信済み";

  } catch (error) {

    console.error(
      "回答保存エラー:",
      error
    );

    status.textContent =
      "送信に失敗しました。";

    submitting = false;
    button.disabled = false;
    button.textContent =
      "回答を送信";
  }
}
    // createCards();
    window.addEventListener(
  "eventLoaded",
  event => {

    currentEventId =
      event.detail.id;

    currentEventOpen =
      event.detail.isOpen;

    const dates = makeDateList(
      event.detail.startDate,
      event.detail.endDate
    );

    eventDates = dates;

    groups = (
      event.detail.groups ||
      event.detail.questions ||
      []
    ).map(
      (question, index) => ({
        id: question.id || `question${index + 1}`,
        title: `${index + 1}. ${question.title}`
      })
    );

    if (groups.some(group => !/^[A-Za-z0-9_-]+$/.test(group.id))) {
      currentEventId = null;
      document.getElementById("eventInfo").textContent = "回答項目の設定を確認してください。";
      return;
    }

    Object.keys(state).forEach(key => delete state[key]);
    Object.keys(simpleState).forEach(key => delete simpleState[key]);

    const submitButton =
      document.getElementById("submitButton");

    const status =
      document.getElementById("status");

    submitButton.disabled = !currentEventOpen;
    document.getElementById("pageTitle").textContent = event.detail.title || "日程調整";

    if (event.detail.isOpen === false) {
      submitButton.disabled = true;
      submitButton.textContent =
        "回答受付終了";
      status.textContent =
        "このイベントの回答受付は終了しました。";
    }

    createCards();

    updateDynamicDateText(
      event.detail.startDate,
      event.detail.endDate
    );
  }
);
  </script>
  <script type="module" src="./event.js"></script>
<script type="module" src="./response.js"></script>
</body>
</html>
