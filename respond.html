<!DOCTYPE html>
<html lang="ja"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>日程調整</title><link rel="stylesheet" href="./respond.css?v=timetable-1"></head>
<body><main class="wrap"><h1 id="pageTitle">日程調整</h1><p id="eventInfo">イベント情報を読み込み中…</p>
<div class="intro"><h2>参加できる曜日・時間をまとめて選ぼう</h2><p>平日は朝・1〜5限・放課後、土日は午前・午後・夜で回答。選択した曜日の予定がイベント期間内の日付に反映されます。</p><p>○ 参加できそう　× 無理　？ 未定<br>未選択は？のまま。授業間の休憩・昼休みも？のままです。</p><p>普段の予定を入れたら、特定の日だけ違う予定を追加できます。</p></div>
<fieldset id="answerFields"><legend class="sr-only">参加者の回答</legend><section class="card"><label for="name">名前</label><input id="name" placeholder="例：山田 太郎" autocomplete="name" maxlength="100"></section><div id="cards"></div></fieldset>
<div class="submit-wrap"><button id="submitButton" disabled>回答を送信</button><p id="status" role="status" aria-live="polite"></p></div>
<p><a href="https://github.com/shin-systems26/schedule-app/discussions/1" target="_blank" rel="noopener noreferrer">ご意見・改善要望はこちら</a></p></main><script type="module" src="./respond.js?v=timetable-1"></script></body></html>
