<!doctype html><html lang="ja"><head><meta charset="utf-8"><title>管理者統合テスト</title></head><body>
<h1>管理者・参加者の導線テスト</h1><p>Firebaseはローカルのテストデータに置き換えています。</p><ol id="results"></ol><p id="summary">実行中…</p><iframe id="app" style="width:100%;height:850px" title="テスト対象"></iframe>
<script type="module">
const frame=document.querySelector('#app'), results=document.querySelector('#results');
const event={title:'ゼミ日程調整',startDate:'2026-10-01',endDate:'2026-10-02',ownerId:'owner',isOpen:true,groups:[{id:'group1',title:'対面'},{id:'group2',title:'オンライン'}]};
const slot='2026-10-01 09:00〜10:00';
let passed=0,failed=0;
const check=(value,message)=>{if(!value)throw Error(message)};
const doc=()=>frame.contentDocument;
const el=id=>doc().getElementById(id);
const pause=()=>new Promise(r=>setTimeout(r,20));
async function until(fn){for(let i=0;i<250;i++){if(fn())return;await pause();}throw Error('Timeout: '+fn);}
function fixture(extra={}){window.testFixture={user:{uid:'owner',displayName:'テスト管理者'},events:{one:structuredClone(event),other:{...event,ownerId:'other'}},responses:{},reads:[],writes:[],batches:[],...extra};}
let navigation=0;
async function go(url){const target=new URL('/fixture/'+url,location.href);target.searchParams.set('testRun',++navigation);frame.src=target.href;await new Promise(r=>frame.onload=r);await pause();}
async function test(name,fn){const li=document.createElement('li');results.append(li);try{await fn();li.textContent='PASS: '+name;passed++;}catch(e){li.textContent='FAIL: '+name+' — '+e.message;failed++;}}
await test('未ログイン→ログイン、自分のイベントのみ表示',async()=>{
 fixture({user:null});await go('');await until(()=>!el('loginPanel').hidden);el('loginButton').click();await until(()=>doc().querySelectorAll('.event-item').length===1);check(!el('dashboard').hidden,'Dashboard missing');
});
await test('期間の検証→自由な質問でイベント作成→管理・共有リンク',async()=>{
 el('title').value='新しいイベント';el('startDate').value='2026-10-02';el('endDate').value='2026-10-01';el('questions').value='対面\nオンライン';el('createButton').click();await until(()=>el('createStatus').textContent.includes('終了日'));
 el('endDate').value='2026-10-03';el('createButton').click();await until(()=>el('manageStatus').textContent.includes('回答者数'));check(el('participantUrl').value.endsWith('respond.html?event=created'),'Wrong share link');check(el('rankingArea').querySelectorAll('h2').length===2,'Missing groups');
});
await test('受付締切→再開→更新失敗時の状態維持',async()=>{
 el('toggleOpenButton').click();await until(()=>el('openStatus').textContent==='締切済み');el('toggleOpenButton').click();await until(()=>el('openStatus').textContent==='回答受付中');window.testFixture.failUpdate=true;el('toggleOpenButton').click();await until(()=>el('manageStatus').textContent.includes('変更できません'));check(!el('toggleOpenButton').disabled,'Retry disabled');check(el('openStatus').textContent==='回答受付中','State changed on failure');window.testFixture.failUpdate=false;
});
await test('ログアウト時に回答と管理画面を消去',async()=>{el('logoutButton').click();await until(()=>el('dashboard').hidden);check(el('responseNames').textContent==='','Private content retained');});
await test('新旧回答データのランキング集計',async()=>{
 fixture({events:{legacy:{...event,groups:undefined}},responses:{legacy:[{name:'旧回答',env:{[slot]:'yes'}},{name:'新回答',answers:{env:{[slot]:'yes'}}}]}});await go('#manage=legacy');await until(()=>el('manageStatus').textContent.includes('2人'));const row=el('rankingArea').querySelector('tbody tr');check(row.textContent.includes('全員○'),'Legacy ranking incorrect');check(row.children[5].textContent.trim()==='6','Score changed');
});
await test('他人のイベントの管理を禁止',async()=>{fixture();await go('#manage=other');await until(()=>el('manageStatus').textContent.includes('権限'));check(el('deleteEventButton').disabled,'Delete enabled');check(testFixture.reads.every(r=>(r.ref||r)==='events'),'Unauthorized responses read');});
await test('削除キャンセル・805回答の分割削除・親イベントは最後に削除',async()=>{
 fixture({responses:{one:Array.from({length:805},()=>({name:'回答者'}))}});await go('#manage=one');await until(()=>el('manageStatus').textContent.includes('805人'));window.confirmDelete=false;el('deleteEventButton').click();check(testFixture.writes.length===0,'Cancelled delete wrote');window.confirmDelete=true;el('deleteEventButton').click();await until(()=>el('appStatus').textContent.includes('削除しました'));check(JSON.stringify(testFixture.batches)==='[400,400,5]','Batch sizes');check(!testFixture.events.one && testFixture.responses.one.length===0,'Remaining data');check(testFixture.writes[0].data.isOpen===false,'Not closed before delete');
});
await test('旧参加者URL転送・questions互換・文字列を安全に表示・回答送信',async()=>{
 fixture({user:null,events:{one:{...event,groups:undefined,questions:[{id:'question1',title:'<img src=x onerror=alert(1)>'},{id:'question2',title:'オンライン'}]}}});await go('index.html?event=one');await until(()=>doc().querySelector('.simple-button'));check(frame.contentWindow.location.pathname.endsWith('/respond.html'),'Old URL not forwarded');check(!doc().querySelector('#cards img'),'Question title interpreted as HTML');el('name').value='参加者';doc().querySelector('[data-group="question1"] .weekly-detail').open=true;doc().querySelector('[data-group="question1"] .day-tabs').children[3].click();doc().querySelector('[data-group="question1"] [data-weekday="4"][data-period="class1"]').click();doc().querySelector('.copy-button').click();el('submitButton').click();await until(()=>el('submitButton').textContent==='送信済み');const response=testFixture.responses.one[0];check(response.answers.question1['2026-10-01 09:00〜10:30']==='yes','Wrong timetable interval');check(JSON.stringify(response.answers.question1)===JSON.stringify(response.answers.question2),'Copy failed');check(Object.keys(response.answers.question1).some(key=>key.startsWith('2026-10-02')),'Missing date');
});
await test('旧管理URL・作成URL・ログインURL転送',async()=>{
 fixture({user:null});await go('admin.html?event=one');await until(()=>el('loginPanel')&&!el('loginPanel').hidden);check(frame.contentWindow.location.hash==='#manage=one','Admin route lost');el('loginButton').click();await until(()=>el('manageStatus').textContent.includes('回答者数'));await go('create.html');await until(()=>el('createForm'));check(frame.contentWindow.location.hash==='#create','Create route lost');await go('login.html');await until(()=>el('loginPanel'));
});
await test('締切済み・存在しない・指定なしのイベントは送信不可',async()=>{
 fixture({user:null,events:{closed:{...event,isOpen:false}}});for(const suffix of ['?event=closed','?event=missing','']){await go('respond.html'+suffix);await until(()=>!el('eventInfo').textContent.includes('読み込み中'));check(el('submitButton').disabled,'Submit enabled for '+suffix);}
});
await test('ログイン失敗の原因別表示と再試行',async()=>{
 fixture({user:null});await go('');await until(()=>el('loginButton')&&!el('loginPanel').hidden);
 for(const [code,message] of [['auth/unauthorized-domain','承認済みドメイン'],['auth/popup-blocked','ブロック'],['auth/popup-closed-by-user','キャンセル'],['auth/cancelled-popup-request','別のログイン'],['auth/network-request-failed','通信できません'],['auth/operation-not-allowed','有効になっていません'],['auth/internal-error','時間をおいて']]){
  testFixture.loginError=code;el('loginButton').click();await until(()=>el('appStatus').textContent.includes(message));check(!el('loginButton').disabled,'Retry disabled: '+code);
  if(code==='auth/unauthorized-domain')check(el('appStatus').textContent.includes(frame.contentWindow.location.hostname),'Missing domain');
 }
 delete testFixture.loginError;el('loginButton').click();await until(()=>!el('dashboard').hidden);check(el('appStatus').textContent==='','Stale error remains');
});
await test('モード選択なしで作成・ランキングの下に分割調整を併記',async()=>{
 fixture();await go('#create');await until(()=>el('createButton')&&!el('createButton').disabled);
 el('title').value='分割練習';el('startDate').value='2026-10-01';el('endDate').value='2026-10-02';el('questions').value='対面';el('createButton').click();
 await until(()=>el('manageStatus').textContent.includes('回答者数'));
 check(!el('scheduleMode')&&!('scheduleMode' in testFixture.events.created),'Mode retained');check(!!(el('rankingArea').compareDocumentPosition(el('splitSection'))&4),'Split not below ranking');check(!el('splitSection').hidden,'Split not opened');check(el('rankingArea').querySelector('table'),'Normal ranking removed');
});
await test('既存イベントで分割提案・主催者指定・プラン選択・設定変更',async()=>{
 const hour=h=>`2026-10-01 ${String(h).padStart(2,'0')}:00〜${String(h+1).padStart(2,'0')}:00`;
 const response=(name,hours)=>({name,answers:{group1:Object.fromEntries(hours.map(h=>[hour(h),'yes']))}});
 fixture({events:{one:{...event,scheduleMode:'split'}},responses:{one:[response('主催者',[15,17]),response('<img src=x>',[15]),response('B',[15]),response('C',[17]),response('D',[17]),response('E',[17])]}});
 const original=JSON.stringify(testFixture.responses);await go('#manage=one');await until(()=>el('manageStatus').textContent.includes('6人'));
 check(!el('splitSection').hidden&&!el('showSplit'),'Split not shown by default');await until(()=>el('splitResults').querySelector('.split-plan'));check(el('rankingArea').querySelector('table'),'Ranking missing alongside plans');el('splitOrganizer').value='0';el('splitRequire').checked=true;el('splitCalculate').click();
 await until(()=>el('splitResults').querySelector('.split-plan'));
 const first=el('splitResults').querySelector('.split-plan');check(first.textContent.includes('5人中5人'),'Coverage incorrect');check(first.textContent.includes('2回開催'),'Count incorrect');check(!first.querySelector('img'),'Unsafe name');
 first.querySelector('button').click();check(el('splitSelection').textContent.includes('選択しました'),'Not selected');
 check(JSON.stringify(testFixture.responses)===original&&testFixture.writes.length===0,'Planner wrote data');
 el('splitMax').value='1';el('splitMax').dispatchEvent(new Event('input',{bubbles:true}));check(!el('splitResults').textContent,'Stale results retained');el('splitCalculate').click();await until(()=>el('splitResults').textContent.includes('参加機会を確保できない人'));
 check(el('splitResults').textContent.includes('5人中3人'),'Fallback coverage');
});
await test('分割条件エラー・計算中止・ログアウトで個人名を消去',async()=>{
 el('splitOrganizer').value='';el('splitCalculate').click();await until(()=>el('splitStatus').textContent.includes('主催者の回答を選択'));
 el('splitRequire').checked=false;el('splitCalculate').click();el('splitCancel').click();check(el('splitStatus').textContent.includes('中止'),'Cancel failed');
 el('logoutButton').click();await until(()=>el('dashboard').hidden);check(el('splitResults').textContent===''&&el('splitOrganizer').textContent===''&&el('splitSection').hidden,'Split personal data retained');
});
await test('回答一覧：新旧データ・未回答・同名・質問と日付と個人の切替・安全な表示',async()=>{
 const second='2026-10-02 09:00〜10:00';
 fixture({responses:{one:[{name:'同名',group1:{[slot]:'yes',[second]:'no'}},{name:'同名',answers:{group1:{[slot]:'no'},group2:{[slot]:'maybe'}}},{name:'<img src=x onerror=alert(1)>',answers:{group1:{[slot]:'maybe'}}}]}});
 await go('#manage=one');await until(()=>el('manageStatus').textContent.includes('3人'));el('answerOverview').open=true;
 const cells=()=>[...el('answerTable').querySelector('tbody tr').querySelectorAll('td')].map(td=>td.textContent).join(',');
 check(cells()==='○,×,？','Wrong answers');check(!el('answerTable').querySelector('img'),'Unsafe name');
 check(el('answerPerson').options[1].text!==el('answerPerson').options[2].text,'Duplicate names ambiguous');
 el('answerNext').click();check(cells()==='×,—,—','Wrong date or missing answers');el('answerPrevious').click();check(cells()==='○,×,？','Previous day failed');
 el('answerGroup').value='group2';el('answerGroup').dispatchEvent(new Event('change'));check(cells()==='—,？,—','Group switch failed');
 el('answerPerson').value='1';el('answerPerson').dispatchEvent(new Event('change'));check(cells()==='？','Person switch failed');
 check(testFixture.writes.length===0,'Read-only view wrote data');
 el('logoutButton').click();await until(()=>el('dashboard').hidden);check(el('answerTable').textContent===''&&el('answerPerson').textContent===''&&el('answerOverview').hidden,'Private answers retained');
});
await test('回答一覧：空イベントと権限のないイベントに回答を残さない',async()=>{
 fixture();await go('#manage=one');await until(()=>el('manageStatus').textContent.includes('0人'));check(el('answerCount').textContent.includes('まだ回答'),'Empty message missing');
 frame.contentWindow.location.hash='manage=other';await until(()=>el('manageStatus').textContent.includes('権限'));check(el('answerOverview').hidden&&el('answerTable').textContent==='','Unauthorized view visible');
});
await test('？を含める場合は要確認と確定人数を明示し、回答を書き換えない',async()=>{
 fixture({responses:{one:[{name:'A',answers:{group1:{[slot]:'yes'}}},{name:'B',answers:{group1:{[slot]:'maybe'}}}]}});
 await go('#manage=one');await until(()=>el('splitResults').textContent.includes('○だけでは100％'));
 const before=JSON.stringify(testFixture.responses);el('splitIncludeMaybe').checked=true;el('splitCalculate').click();
 await until(()=>el('splitResults').textContent.includes('要確認プラン'));
 check(el('splitResults').textContent.includes('確認後の見込み100％'),'Missing conditional coverage');
 check(el('splitResults').textContent.includes('○のみで参加機会を確保：1人／2人'),'Confirmed count missing');
 check(el('splitResults').textContent.includes('この日時の？を確認する人：B'),'Confirmation target missing');
 check(JSON.stringify(testFixture.responses)===before&&testFixture.writes.length===0,'Changed answers');
});
await test('まとめて入力・土日3区分・例外優先・取消とコピー・送信内容',async()=>{
 fixture({user:null,events:{one:{...event,startDate:'2026-10-26',endDate:'2026-11-01'}}});await go('respond.html?event=one');await until(()=>doc().querySelector('.quick-entry'));
 const card=doc().querySelector('[data-group="group1"]'),q=s=>card.querySelector(s);
 q('.quick-entry [data-value="yes"]').click();check(q('.edit-status').textContent.includes('1つ以上'),'Missing selection validation');
 for(const d of ['1','3','5'])q('.days input[value="'+d+'"]').checked=true;q('.periods input[value="after"]').checked=true;q('[data-value="yes"]').click();
 q('.day-type').value='weekend';q('.day-type').dispatchEvent(new Event('change'));check(q('.periods').querySelectorAll('input').length===3,'Weekend not three choices');
 q('.days input[value="6"]').checked=true;q('.periods input[value="afternoon"]').checked=true;q('[data-value="yes"]').click();
 q('.exceptions').open=true;q('.exception-date').value='2026-10-31';q('.exception-start').value='14:00';q('.exception-end').value='15:30';q('.exception-add').click();check(q('.exception-list').textContent.includes('14:00〜15:30：×'),'Exception missing');
 q('[data-value="yes"]').click();check(q('.exception-list').textContent.includes('×'),'Batch erased exception');
 doc().querySelector('.copy-button').click();el('name').value='時間割テスト';el('submitButton').click();await until(()=>el('submitButton').textContent==='送信済み');
 const answer=testFixture.responses.one[0].answers;check(answer.group1['2026-10-26 17:50〜22:00']==='yes','After school boundary');check(answer.group1['2026-10-31 14:00〜15:30']==='no','Exception serialization');check(JSON.stringify(answer.group1)===JSON.stringify(answer.group2),'Copy mismatch');check(el('answerFields').disabled,'Can edit submitted answers');
});
await test('日時指定の検証・取消・直前の変更を元に戻す',async()=>{
 fixture({user:null});await go('respond.html?event=one');await until(()=>doc().querySelector('.exceptions'));const card=doc().querySelector('[data-group="group1"]'),q=s=>card.querySelector(s);
 q('.exception-start').value='15:30';q('.exception-end').value='14:00';q('.exception-add').click();check(q('.edit-status').textContent.includes('10分単位'),'Invalid interval accepted');
 q('.exception-start').value='14:00';q('.exception-end').value='15:30';q('.exception-add').click();q('.exception-list button').click();check(q('.exception-list').textContent==='','Cancel failed');q('.copy-tools button').click();check(q('.exception-list').textContent.includes('14:00'),'Undo failed');
});
await test('時間割回答の管理表示・17:50開始のランキングと分割案',async()=>{
 const interval='2026-10-01 17:50〜18:50';fixture({responses:{one:[{name:'A',answers:{group1:{[interval]:'yes'}}},{name:'B',answers:{group1:{[interval]:'yes'}}}]}});
 await go('#manage=one');await until(()=>el('splitResults').textContent.includes('17:50〜18:50'));check(el('rankingArea').querySelector('tbody tr').textContent.includes(interval),'Ranking rounded time');
 el('answerOverview').open=true;check(el('answerTable').textContent.includes('17:50〜18:00'),'Answer detail lost boundary');check(el('splitResults').textContent.includes('2人中2人'),'Coverage lost');
});
document.querySelector('#summary').textContent=`${passed} passed / ${failed} failed`;
fixture();await go('#manage=one');
</script></body></html>
