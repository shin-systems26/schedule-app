<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>分割日程プレビュー（架空データ）</title><style>body{margin:0}iframe{border:0;width:100%;height:100vh;display:block}</style></head><body><iframe id="preview" title="架空の5人と主催者の分割調整"></iframe><script>
